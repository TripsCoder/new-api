name: new-api-app

# Application only. Existing postgres/redis and new-api-network are managed separately.
services:
  new-api:
    image: tripscoder/new-api:deploy-0f38a14a5e8e
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: new-api-official
    restart: always
    # Keep the existing Nginx upstream http://switcher-api:8080 unchanged.
    command: ["--log-dir", "/app/logs", "--port", "8080"]
    env_file:
      - path: ${NEW_API_ENV_FILE:?Set NEW_API_ENV_FILE to an absolute path outside the repository}
        required: true
        format: raw
    ports:
      - "127.0.0.1:5000:8080"
    volumes:
      - type: bind
        source: /home/ubuntu/code/new-api/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/code/new-api/logs
        target: /app/logs
        bind:
          create_host_path: false
    networks:
      existing:
        aliases: [new-api-official, switcher-api]
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/status | grep -q '\"success\":[[:space:]]*true'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

  frontend:
    image: tripscoder/new-api-frontend:deploy-0f38a14a5e8e
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: new-api-official-frontend
    restart: always
    env_file:
      - path: ${FRONTEND_ENV_FILE:?Set FRONTEND_ENV_FILE to the preserved frontend environment outside Git}
        required: true
        format: raw
    ports:
      - "80:80"
      # Existing deployment publishes 443 but has SSL disabled. No TLS listener is added here.
      - "443:443"
    depends_on:
      new-api:
        condition: service_healthy
    networks: [existing]
    stop_signal: SIGQUIT
    stop_grace_period: 660s

networks:
  existing:
    external: true
    name: new-api-network
