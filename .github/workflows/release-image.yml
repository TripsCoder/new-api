name: Publish public release image

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-api-release-image
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'TripsCoder/new-api' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GIN_MODE: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Check public publication guard
        run: node --test deploy/check-public-image.test.mjs
      - name: Verify reviewed Fenglang plugin source and usage fixtures
        run: |
          node plugin-sources/fenglang-video/build.mjs --check
          node plugin-sources/fenglang-video/plugin.test.mjs
          git diff --exit-code -- plugin-sources/fenglang-video
      - name: Verify affected backend packages
        run: |
          go vet ./pkg/jsplugin ./plugins ./middleware ./controller ./relay/channel/task/jsplugin
          go test -count=1 -timeout=5m ./pkg/jsplugin ./plugins ./middleware ./relay/channel/task/jsplugin
          TEST_PATTERN="$(sed -nE 's/^func (Test[A-Za-z0-9_]+)\(.*/\1/p' controller/channel_upstream_update_test.go | paste -sd '|' -)"
          test -n "$TEST_PATTERN"
          go test -count=1 -timeout=5m ./controller -run "^(${TEST_PATTERN})$"
          go test -count=1 -timeout=5m ./service -run '^(TestRefundTaskQuota|TestSettle_|TestTaskBillingOther|TestLogTaskConsumption)'
      - name: Verify affected frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test src/features/channels/components/__tests__/channel-configuration.test.tsx
          bunx --no-install oxlint -c .oxlintrc.json src/features/channels/components/drawers/channel-mutate-drawer.tsx src/features/channels/components/__tests__/channel-configuration.test.tsx

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tripscoder/new-api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse an existing non-public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node deploy/check-public-image.mjs --allow-missing
      - name: Set release version
        run: printf 'release-%s\n' "${GITHUB_SHA:0:12}" > VERSION
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build exact release commit
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=release-${{ github.sha }}
          cache-from: type=gha,scope=new-api-release-amd64
          cache-to: type=gha,mode=max,scope=new-api-release-amd64
      - name: Verify image plugin runtime without network or database
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/plugin-sources,dst=/snapshots,readonly" \
            "$IMAGE:sha-$GITHUB_SHA" plugin test /snapshots/fenglang-video/dist/fenglang_video.plugin.js --fixture /snapshots/fenglang-video/fixture.json
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/plugins/tasks/doubao-audio,dst=/plugin,readonly" \
            --mount "type=bind,src=$PWD/plugin-sources,dst=/snapshots,readonly" \
            "$IMAGE:sha-$GITHUB_SHA" plugin test /plugin/plugin.js --fixture /snapshots/doubao-audio/fixtures/hooks.json
          for plugin in plugin-sources/installed/*/plugin.js; do
            docker run --rm --network none \
              --mount "type=bind,src=$PWD/plugin-sources,dst=/snapshots,readonly" \
              "$IMAGE:sha-$GITHUB_SHA" plugin lint "/snapshots/${plugin#plugin-sources/}"
          done
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit image
        run: docker push "$IMAGE:sha-$GITHUB_SHA"
      - name: Verify published package is public and linked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node deploy/check-public-image.mjs
      - name: Update release alias only for current branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release" --jq '.object.sha')"
          if [ "$CURRENT_SHA" = "$GITHUB_SHA" ]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:release"
            docker push "$IMAGE:release"
          else
            echo 'A newer release commit exists; its release alias is not overwritten.'
          fi
          DIGEST="$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          {
            echo '### Public new-api release image'
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE:sha-$GITHUB_SHA"
            echo "Digest: $DIGEST"
            echo 'Visibility: public; platform: linux/amd64; no server deployment performed.'
          } >> "$GITHUB_STEP_SUMMARY"
